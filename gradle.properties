# ----------------------------------------------------------------------------
# Nerospace cross-loader build — MultiLoader-Template (ModDevGradle + Fabric Loom + ForgeGradle)
#
# This IS the repo-root build (post_port.md Phase 2 flattened it). The retired
# standalone single-loader build lives under legacy/ (frozen, not shipped).
# Run from the repo root with its Gradle 9.6.0 wrapper.
#
# Layout (no architectury-loom — see docs/MULTILOADER.md):
#   common   -> net.neoforged.moddev, NeoForm-only (de-obfuscated vanilla); spliced into each node
#   fabric   -> net.fabricmc.fabric-loom (omits `mappings` for de-obf 26.x)
#   neoforge -> net.neoforged.moddev (full NeoForge userdev)
#   forge    -> net.minecraftforge.gradle (full Forge userdev)
# common's source is shared into fabric/neoforge/forge (one copy -> no drift).
#
# Version axis = Stonecutter: each loader x MC version is its own node
# (:fabric:26.1.2 :fabric:26.2 :fabric:26.3 :neoforge:26.1.2 :neoforge:26.2 :neoforge:26.3 :forge:26.1.2 :forge:26.2 :forge:26.3); the *_<mc> pins
# below feed the matching node. (minecraft_version below = the IDE-active default.)
# ----------------------------------------------------------------------------

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
# ModDevGradle/Loom do not always agree with the configuration cache; off here.
org.gradle.configuration-cache=false

## Mod metadata (shared by all loaders) --------------------------------------
mod_id=nerospace
mod_name=NeroSpace
# The mod version is independent of the Minecraft version; it is the same for all builds.
mod_version=1.5.5
mod_group_id=za.co.neroland.nerospace
mod_license=All Rights Reserved (modpacks allowed - see LICENSE)
mod_authors=Neroland

## IDE-active Minecraft default (Stonecutter; switch via stonecutterSwitchTo… ) --
minecraft_version=26.3

## Version matrix (CI iterates these) ---------------------------------------
mc_versions=26.1.2,26.2,26.3

## NeoForm — the de-obfuscated vanilla base the `common` module compiles against
## (https://projects.neoforged.net/neoforged/neoform). NeoForm 26.2 IS published.
neo_form_version_26.1.2=26.1.2-1
neo_form_version_26.2=26.2-2
neo_form_version_26.3=26.3-1

## NeoForge userdev — the `neoforge` module
## (https://projects.neoforged.net/neoforged/neoforge).
neo_version_26.1.2=26.1.2.116
# 26.2 beta is on Maven per the official MultiLoader-Template default. If it ever
# fails to resolve, self-build the 26.2.x branch to mavenLocal() (see README) and
# set this to the version it publishes — that is the ONLY change needed.
neo_version_26.2=26.2.0.90
neo_version_26.3=26.3.0.76

## MinecraftForge / Forge userdev — the `forge` module
## (https://files.minecraftforge.net/net/minecraftforge/forge/).
forge_version_26.1.2=26.1.2-64.1.4
forge_version_26.2=26.2-65.1.4
forge_version_26.3=26.3-66.0.11

## JEI (mezz.jei, BlameJared maven) — common API recipe-viewer compat. NeoForge/Fabric publish loader
## runtime artifacts on these pins; JEI's Forge loader artifacts are not currently published for these pins,
## so forge/build.gradle uses only the common API compile-time surface.
jei_version_26.1.2=29.47.0.109
jei_version_26.2=30.42.0.236
jei_version_26.3=31.12.0.65
## Oldest JEI each line's jar is known to work with: the loader metadata declares it as an OPTIONAL
## dependency floor (Fabric `breaks`, NeoForge `optional`, Forge `mandatory = false`) so an older JEI is
## refused with a clear message instead of crashing mid-game (MC-NEROSPACE-T / -V). JEI stays optional.
## These are the first JEI release on each line; every JEI API call in compat/jei was checked against them
## (it no longer binds ITextWidget#setPosition, which JEI only added in later 30.x builds). Raise a floor
## whenever compat/jei starts using a newer JEI API.
jei_min_version_26.1.2=29.5.0.24
jei_min_version_26.2=30.0.0.1
jei_min_version_26.3=31.0.0.3
## EMI — optional recipe-viewer compat (compat/emi). Official EMI has no MC 26.x release, so this pins the
## community "EMI Unofficial Port (Unstable)" (CurseForge project 1544558, MIT, upstream dev.emi.emi.api
## unchanged), fetched through CurseMaven by CurseForge FILE id. NeoForge + Fabric only; the Forge cells
## compile against the NeoForge file (API only). Dev clients load EMI only with -PwithEmi.
emi_file_neoforge_26.1.2=8630349
emi_file_neoforge_26.2=8616659
emi_file_neoforge_26.3=8897084
emi_file_fabric_26.1.2=8630346
emi_file_fabric_26.2=8616656
emi_file_fabric_26.3=8897080

## Neroland Core — shared foundation library (required dependency, loads BEFORE Nerospace).
## Consumed per-loader as za.co.neroland.nerolandcore:nerolandcore-<loader>-<mc>:<this>. Resolved from
## mavenLocal() — run `./gradlew publishToMavenLocal` in ../neroland-core first (see docs/USING-CORE.md).
## A shared remote Maven (GitHub Packages) for CI/other contributors is a documented follow-up.
## This value is ALSO the loader dependency floor: neoforge/forge build.gradle derive
## nerolandcore_version_range = "[${nerolandcore_version},2.0)" and fabric.mod.json derives
## ">=${nerolandcore_version} <2.0.0" from it. Never hardcode a range — an old Core loading against a
## newer Nerospace is a known crash class. Core's V1 API is frozen (additive-only minors), so raising
## this floor cannot break compilation; it only refuses an out-of-date Core at load time.
nerolandcore_version=1.15.0

## NeroEconomy — OPTIONAL (compileOnly; never bundled or required). Consumed per-loader as
## za.co.neroland.neroeconomy:neroeconomy-<loader>-<mc>:<this> from mavenLocal() or GitHub Packages.
## The loader metadata only suggests it (floor 0.3.0-beta.1, the first release with API_VERSION 1).
neroeconomy_version=0.4.0-beta.1

## Fabric (https://fabricmc.net/develop) ------------------------------------
fabric_loader_version=0.19.5
fabric_api_version_26.1.2=0.155.3+26.1.2
# Bump in lockstep with the JEI fabric pin; older Fabric API builds can trip loader
# "requires ... or later" checks from JEI's Fabric artifact.
fabric_api_version_26.2=0.161.0+26.2
fabric_api_version_26.3=0.162.0+26.3
