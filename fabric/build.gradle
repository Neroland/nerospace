// fabric: Fabric Loom. De-obfuscated 26.x: NO `mappings` line. Shares the common
// module's source directly (single copy -> no drift).

plugins {
    // Two Loom flavours from the same plugin jar: `fabric-loom` for de-obfuscated 26.x (no mappings, no
    // remap) and `fabric-loom-remap` for obfuscated 1.21.x (Mojang mappings + remapJar to intermediary).
    // Neither is applied here; the node picks one below from its Minecraft version.
    id 'net.fabricmc.fabric-loom' apply false
    id 'net.fabricmc.fabric-loom-remap' apply false
    id 'eclipse'   // for eclipse.synchronizationTasks (VS Code / Buildship import hook)
    id 'maven-publish'
}

// MC version comes from the Stonecutter node (e.g. :fabric:26.1.2), not a global property.
def mc = stonecutter.current.version
// Minecraft before 26.1 ships obfuscated, so those cells need mappings and a remapped jar.
def obfuscated = mc.startsWith('1.')
apply plugin: obfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'
// Upper bound of this cell's Minecraft range: the next minor line (26.1.2 -> 26.2, 26.2 -> 26.3); 1.21.x
// lines are spelled out in gradle.properties (mc_ceiling_<v>). Without it a jar built for one line loads on
// the next and dies on a changed signature at runtime
// (Sentry MC-NEROLAND-CORE-2: a 26.2 jar on 26.3 hit NoSuchMethodError in ResourceManager.listResources).
def mcCeiling = project.findProperty("mc_ceiling_${mc}") ?: mc.tokenize('.').with { "${it[0]}.${it[1].toInteger() + 1}" }
// Lowest Minecraft this jar accepts: the compiled version, or an older hotfix sibling (gradle.properties).
def mcFloor = project.findProperty("mc_floor_${mc}") ?: mc
// Official EMI (dev.emi on the TerraformersMC maven) for lines the unofficial 26.x port does not cover.
def emiVersion = project.findProperty("emi_version_${mc}")
def fabricApi = project.findProperty("fabric_api_version_${mc}")
def jeiVersion = project.findProperty("jei_version_${mc}")
// Oldest JEI this cell supports (optional-dependency floor in fabric.mod.json `breaks`); falls back to the pin.
def jeiMinVersion = project.findProperty("jei_min_version_${mc}") ?: jeiVersion ?: '0'
def emiFile = project.findProperty("emi_file_fabric_${mc}")
def nerolandcoreVersion = project.findProperty('nerolandcore_version')

// This node's projectDir is <loader>/versions/<v>; the authoritative loader source +
// resources live in the BRANCH root (fabric/). Resolve branch-root paths via the parent.
def branchDir = project.parent.projectDir

// Distinct, descriptive jar name per cell (the node project is named after the MC version, so the
// default jar would be "<mc>-<version>.jar" and COLLIDE with the neoforge cell of the same version).
base { archivesName = "nerospace-fabric-${mc}" }

// Maven publishing for sibling-mod consumption (NeroTech's optional api interop) — mirrors
// ../neroland-core's publishing; see the neoforge module's block for the full rationale.
publishing {
    publications {
        register('mod', MavenPublication) {
            groupId = rootProject.mod_group_id
            artifactId = "nerospace-fabric-${mc}"
            version = rootProject.mod_version
            // 1.21.x consumers remap Nerospace with modCompileOnly/modImplementation, so they need the
            // intermediary jar.
            artifact tasks.named(obfuscated ? 'remapJar' : 'jar')
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/Neroland/nerospace'
            credentials {
                username = providers.gradleProperty('gpr.user').orElse(providers.environmentVariable('GITHUB_ACTOR')).getOrNull()
                password = providers.gradleProperty('gpr.key').orElse(providers.environmentVariable('GITHUB_TOKEN')).getOrNull()
            }
        }
    }
}

// Pull in the shared common source + resources.
sourceSets.main.java.srcDir rootProject.ext.commonJava
sourceSets.main.resources.srcDir rootProject.ext.commonResources

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    if (obfuscated) {
        // Obfuscated 1.21.x: Mojang's official names, remapped to intermediary on jar. Mod dependencies
        // (loader, Fabric API, Core) go through modImplementation so Loom remaps them; optional NeroEconomy is
        // remapped compile-only.
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
        if (fabricApi != null) {
            modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApi}"
        }
        modImplementation "za.co.neroland.nerolandcore:nerolandcore-fabric-${mc}:${nerolandcoreVersion}"
        modCompileOnly "za.co.neroland.neroeconomy:neroeconomy-fabric-${mc}:${project.findProperty('neroeconomy_version')}"
    } else {
    // NOTE: no `mappings` — de-obfuscated 26.x needs none (Fabric Loom 1.17+).
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    if (fabricApi != null) {
        implementation "net.fabricmc.fabric-api:fabric-api:${fabricApi}"
    }

    // Neroland Core — REQUIRED shared foundation (one energy network, progression gates, data erasure).
    // Plain `implementation` (NOT `include`) — matching how fabric-api is declared here: this de-obf 26.x
    // Loom setup omits `mappings`, so there is no intermediary→named remap and Loom's `modImplementation`
    // configuration isn't available. Core's classes land on the compile+dev-runtime classpath and Fabric
    // Loader discovers it as a mod via its bundled fabric.mod.json. Resolved from mavenLocal(). Core loads
    // BEFORE Nerospace (see fabric.mod.json depends).
    implementation "za.co.neroland.nerolandcore:nerolandcore-fabric-${mc}:${nerolandcoreVersion}"

    // NeroEconomy — OPTIONAL. Its public API on the compile classpath only: never bundled, never required.
    // Every reference lives in compat/neroeconomy, touched only after isModLoaded("neroeconomy").
    compileOnly "za.co.neroland.neroeconomy:neroeconomy-fabric-${mc}:${project.findProperty('neroeconomy_version')}"
    }

    // Sentry SDK (telemetry/NerospaceTelemetry): compile against it + embed it as a jar-in-jar so the
    // shipped Fabric jar carries it. Counterpart to the NeoForge JarJar bundling.
    implementation 'io.sentry:sentry:8.60.0'
    include 'io.sentry:sentry:8.60.0'

    // JEI (optional recipe-viewer compat). The shared compat/jei plugin lives in `common` and uses ONLY
    // the loader-agnostic JEI common API; on Fabric it compiles against the common + fabric APIs and loads
    // against the Fabric JEI mod at dev runtime. JEI is a soft dependency (compile-time API only; the mod
    // is runtime-only). Same per-MC version as NeoForge (jei_version_<mc>, BlameJared maven from the root).
    if (jeiVersion && obfuscated) {
        // 1.21.x: JEI's Fabric artifacts are intermediary-named, so they go through Loom's remap. JEI published
        // no Fabric build for 1.21.4, so that cell compiles against the (Mojang-named) common API only
        // (jei_fabric_<mc>=false in gradle.properties).
        if (project.findProperty("jei_fabric_${mc}") != 'false') {
            modCompileOnly "mezz.jei:jei-${mc}-common-api-intermediary:${jeiVersion}"
            modCompileOnly "mezz.jei:jei-${mc}-fabric-api:${jeiVersion}"
            modRuntimeOnly "mezz.jei:jei-${mc}-fabric:${jeiVersion}"
        } else {
            compileOnly "mezz.jei:jei-${mc}-common-api:${jeiVersion}"
        }
    } else if (jeiVersion) {
        compileOnly "mezz.jei:jei-${mc}-common-api:${jeiVersion}"
        compileOnly "mezz.jei:jei-${mc}-fabric-api:${jeiVersion}"
        runtimeOnly "mezz.jei:jei-${mc}-fabric:${jeiVersion}"
    }

    // EMI (optional recipe-viewer compat). Same shape as NeoForge: compile against the Fabric EMI jar, load
    // it in the dev client only with -PwithEmi. EMI finds the plugin through the `emi` entrypoint in
    // fabric.mod.json.
    if (emiFile) {
        compileOnly "curse.maven:emi-unofficial-port-unstable-1544558:${emiFile}"
        if (project.hasProperty('withEmi')) {
            runtimeOnly "curse.maven:emi-unofficial-port-unstable-1544558:${emiFile}"
        }
    }
    if (emiVersion) {
        modCompileOnly "dev.emi:emi-fabric:${emiVersion}:api"
        if (project.hasProperty('withEmi')) {
            modRuntimeOnly "dev.emi:emi-fabric:${emiVersion}"
        }
    }
}

// compat/emi compiles only where an EMI API exists for this Minecraft line (the 26.x port or official EMI on
// 1.21.1). Elsewhere EMI itself does not exist, so the plugin is left out of the jar.
if (!emiFile && !emiVersion) {
    sourceSets.main.java.exclude('za/co/neroland/nerospace/compat/emi/**')
}

// Expand fabric.mod.json from src/main/templates into a generated resources dir.
// The template is NOT under src/main/resources, so the IDE never copies a RAW
// (token-laden) fabric.mod.json into bin/main. eclipse.synchronizationTasks runs
// this on VS Code/Buildship import, so bin/main gets the EXPANDED manifest and
// Run & Debug works — while values stay dynamic (sourced from gradle.properties).
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def props = [
        mod_id               : rootProject.mod_id,
        mod_version          : rootProject.mod_version,
        mod_name             : rootProject.mod_name,
        mod_authors          : rootProject.mod_authors,
        mod_license          : rootProject.mod_license,
        fabric_loader_version: rootProject.fabric_loader_version,
        minecraft_version    : mcFloor,
        minecraft_version_ceiling: mcCeiling,
        // Floor the required Core version at what we compile against so the loader refuses to
        // run Nerospace against a Core too old to have the APIs it references (e.g. the
        // sideconfig package added in Core 1.3.0) instead of crashing at registration.
        nerolandcore_version : nerolandcoreVersion,
        // JEI stays optional; only a JEI older than this is refused (MC-NEROSPACE-V).
        jei_min_version      : jeiMinVersion,
    ]
    inputs.properties(props)
    expand(props)
    from "${branchDir}/src/main/templates"
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
eclipse.synchronizationTasks generateModMetadata

// The access widener's namespace differs by era: 26.x is `official` (de-obfuscated), 1.21.x is `named`
// (Mojang mappings, remapped to intermediary in remapJar). Each 1.21.x line has its own file under
// src/main/accesswidener/, swapped into the jar under the name fabric.mod.json declares.
def awFile = obfuscated ? file("${branchDir}/src/main/accesswidener/${mc}.accesswidener")
        : file("${branchDir}/src/main/resources/nerospace.accesswidener")
if (obfuscated) {
    tasks.named('processResources', ProcessResources) {
        exclude 'nerospace.accesswidener'
        from(awFile) { rename { 'nerospace.accesswidener' } }
    }
}

loom {
    accessWidenerPath = awFile

    runs {
        client {
            client()
            // Do NOT let Loom write Eclipse *.launch files — they embed absolute machine
            // paths. The committed .vscode/launch.json (relative ${workspaceFolder}) is the
            // single source of truth for run/debug.
            ideConfigGenerated false
            runDir 'runs/client'
        }
        server {
            server()
            ideConfigGenerated false
            runDir 'runs/server'
        }
    }
}

// Loom creates each run's `runDir` lazily on first launch, but VS Code opens the
// debug terminal in that cwd BEFORE the program starts — so a never-yet-run config
// fails with "Starting directory (cwd) ... does not exist". Pre-create the dirs so
// the cwd always exists. Wired into (a) the Fabric preLaunchTask `configureLaunch`
// (runs before each launch) and (b) eclipse.synchronizationTasks (fresh IDE import).
def createFabricRunDirs = tasks.register('createFabricRunDirs') {
    description = 'Pre-create Loom run directories so the IDE debug-terminal cwd exists before first launch.'
    doLast {
        file('runs/client').mkdirs()
        file('runs/server').mkdirs()
    }
}
eclipse.synchronizationTasks createFabricRunDirs
tasks.matching { it.name == 'configureLaunch' }.configureEach { dependsOn createFabricRunDirs }

// ecjCheck: run the Eclipse compiler over common + fabric main sources, with the same prefs as VS Code.
configurations {
    ecj
}
dependencies {
    ecj 'org.eclipse.jdt:ecj:+'
}
tasks.register('ecjCheck', JavaExec) {
    group = 'verification'
    description = 'Run the Eclipse (IDE) analyzer over common + fabric main sources and report its diagnostics.'
    notCompatibleWithConfigurationCache('assembles the analysis classpath at execution time')
    dependsOn tasks.named('compileJava')
    classpath = configurations.ecj
    mainClass = 'org.eclipse.jdt.internal.compiler.batch.Main'
    doFirst {
        def analysisCp = (sourceSets.main.compileClasspath.files + sourceSets.main.output.files)
                .findAll { it.exists() }
                .join(File.pathSeparator)
        def srcDirs = sourceSets.main.java.srcDirs.findAll { it.exists() }.collect { it.absolutePath }
        args = [
                '--release', "${project.javaRelease}",
                '-proc:none',
                '-d', 'none',
                '-properties', rootProject.file('tools/ecj.prefs').absolutePath,
                // No '-warn:' override — tools/ecj.prefs is the single source of truth for severities.
                // A CLI -warn:+token forces a category ON regardless of the prefs `ignore`, so the
                // framework-interop nullness categories would re-appear. nullanalysis=enabled in the
                // prefs already turns annotation-based analysis on for the genuine categories.
                '-annotationpath', 'CLASSPATH',
                '-classpath', analysisCp,
        ] + srcDirs
    }
}
