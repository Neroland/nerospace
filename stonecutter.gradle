// =====================================================================
// Stonecutter controller — this IS the root project's build script.
// (Stonecutter repoints rootProject.buildFileName here, so the old root
// build.gradle config lives in this file now.)
//
// Holds: (a) the active version checked out in the IDE, (b) the shared
// config applied to every loader node, (c) the shared-common source roots.
// =====================================================================
plugins {
    id 'dev.kikugie.stonecutter'
}

// The version checked out in the IDE / used by a plain `build`. Switch with the
// generated `stonecutterSwitchTo26_1_2` / `...26_2` tasks (or the IDE button).
// A string LITERAL — Stonecutter rewrites it in place on switch. Groovy needs the
// dot form (`stonecutter.active`, not the Kotlin infix `stonecutter active`).
stonecutter.active '26.2'

allprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version
}

// Mechanical renames for Minecraft lines older than the source state (the source is written for 26.x).
// Applied, in order, to the shared common/ Java source of every node whose version is below `below`,
// AFTER Stonecutter's own //? processing. Only for pure renames Mojang made with no behaviour change;
// anything else uses //? if blocks in the source. Loader src/ trees do NOT get these (use //? there).
ext.legacyRenames = [
    // 1.21.11 renamed ResourceLocation -> Identifier and ResourceKey.location() -> identifier().
    [below: '1.21.11', from: /\bIdentifier\b/, to: 'ResourceLocation'],
    [below: '1.21.11', from: /\.identifier\(\)/, to: '.location()'],
    // 26.1 renamed GuiGraphics -> GuiGraphicsExtractor and its drawString(..) -> text(..). The text()
    // rename is keyed on the receiver names this codebase uses for the graphics object (g / graphics).
    [below: '26.1', from: /\bGuiGraphicsExtractor\b/, to: 'GuiGraphics'],
    // 1.21.1-1.21.4 have no SavedDataType and an abstract NBT SavedData.save(..). Core ships look-alikes
    // in data.compat; stores are declared through data.SavedDataCompat, so only these two lines differ.
    [below: '1.21.5', from: /import net\.minecraft\.world\.level\.saveddata\.SavedDataType;/,
            to: 'import za.co.neroland.nerolandcore.data.compat.SavedDataType;'],
    [below: '1.21.5', from: /(\bclass\s+\w+\s+)extends\s+SavedData\b/,
            to: '$1extends za.co.neroland.nerolandcore.data.compat.CodecSavedData'],
    [below: '26.1', from: /\b(g|graphics|guiGraphics)\.text\(/, to: '$1.drawString('],
    // 1.21.2 renamed Registry.get(ResourceLocation|ResourceKey) -> getValue(..) (same arguments, same result).
    // Keyed on BuiltInRegistries receivers so Map.Entry/BlockState getValue(..) calls are left alone.
    [below: '1.21.2', from: /\b(BuiltInRegistries\.[A-Z_]+)\.getValue\(/, to: '$1.get('],
    // 1.21.1-1.21.5 have no ValueInput/ValueOutput (block entities load/save a CompoundTag + registry
    // lookup). Core ships look-alikes in data.compat; the save/load overrides themselves are //? blocks.
    [below: '1.21.6', from: /import net\.minecraft\.world\.level\.storage\.ValueInput;/,
            to: 'import za.co.neroland.nerolandcore.data.compat.ValueInput;'],
    [below: '1.21.6', from: /import net\.minecraft\.world\.level\.storage\.ValueOutput;/,
            to: 'import za.co.neroland.nerolandcore.data.compat.ValueOutput;'],
    // Loader APIs renamed for 26.1: Fabric Transfer's ContainerStorage was InventoryStorage, the payload
    // registries were playS2C/playC2S; Forge's ModList was an instance (ModList.get()).
    [below: '26.1', from: /\bContainerStorage\b/, to: 'InventoryStorage'],
    [below: '26.1', from: /PayloadTypeRegistry\.clientboundPlay\(\)/, to: 'PayloadTypeRegistry.playS2C()'],
    [below: '26.1', from: /PayloadTypeRegistry\.serverboundPlay\(\)/, to: 'PayloadTypeRegistry.playC2S()'],
    [below: '26.1', from: /\bModList\.(getMods|isLoaded|getModContainerById)\(/, to: 'ModList.get().$1('],
    // --- Nerospace additions (pure renames only; everything else is a //? block in the source) ---
    // 26.1 GuiGraphicsExtractor names, for this codebase's other receiver name (`extractor`) and the other methods.
    [below: '26.1', from: /\b(extractor)\.text\(/, to: '$1.drawString('],
    [below: '26.1', from: /\b(g|graphics|guiGraphics|extractor)\.centeredText\(/, to: '$1.drawCenteredString('],
    [below: '26.1', from: /\b(g|graphics|guiGraphics|extractor)\.textWithWordWrap\(/, to: '$1.drawWordWrap('],
    [below: '26.1', from: /\b(g|graphics|guiGraphics|extractor)\.item\(/, to: '$1.renderItem('],
    [below: '26.1', from: /\b(g|graphics|guiGraphics|extractor)\.outline\(/, to: '$1.renderOutline('],
    // 26.1 renamed ClickType -> ContainerInput and FarmBlock -> FarmlandBlock.
    [below: '26.1', from: /\bContainerInput\b/, to: 'ClickType'],
    [below: '26.1', from: /\bFarmlandBlock\b/, to: 'FarmBlock'],
    // 26.1 made ChunkPos a record: static asLong(..) became pack(..), the BlockPos/long constructors became
    // containing(..)/unpack(..).
    [below: '26.1', from: /\bChunkPos\.pack\(/, to: 'ChunkPos.asLong('],
    [below: '26.1', from: /\bChunkPos\.containing\(/, to: 'new ChunkPos('],
    [below: '26.1', from: /\bChunkPos\.unpack\(/, to: 'new ChunkPos('],
    // 26.1 Player.sendSystemMessage/sendOverlayMessage were displayClientMessage(.., false|true); routed through
    // compat.mc.ChatCompat so the receiver keeps its static type.
    [below: '26.1', from: /(?<![\w.])([a-z]\w*(?:\.[a-z]\w*)*)\.sendSystemMessage\(/, to: 'za.co.neroland.nerospace.compat.mc.ChatCompat.system($1, '],
    [below: '26.1', from: /(?<![\w.])([a-z]\w*(?:\.[a-z]\w*)*)\.sendOverlayMessage\(/, to: 'za.co.neroland.nerospace.compat.mc.ChatCompat.overlay($1, '],
    // 26.1 screen render names: Screen.render -> extractRenderState (keyed on the GUI-graphics argument so entity
    // renderers' extractRenderState is left alone), AbstractContainerScreen.renderLabels -> extractLabels.
    [below: '26.1', from: /\bextractRenderState\((?=\s*(?:GuiGraphics(?:Extractor)?\b|(?:g|extractor|graphics|guiGraphics)\s*,))/, to: 'render('],
    [below: '26.1', from: /\bextractLabels\(/, to: 'renderLabels('],
    // 26.1 moved CameraRenderState into renderer.state.level and replaced Level.getDayTime() with world clocks.
    [below: '26.1', from: /import net\.minecraft\.client\.renderer\.state\.level\.CameraRenderState;/,
            to: 'import net.minecraft.client.renderer.state.CameraRenderState;'],
    [below: '26.1', from: /\.getDefaultClockTime\(\)/, to: '.getDayTime()'],
    // Other 26.1 renames: ItemStack.getItemHolder -> typeHolder, Particle.getLightColor -> getLightCoords,
    // Holder.Reference.isBound -> areComponentsBound, ItemContainerContents.nonEmptyStream (+copy) ->
    // nonEmptyItemCopyStream, Entity.interact gained the hit location (unused by these overrides).
    [below: '26.1', from: /\.typeHolder\(\)/, to: '.getItemHolder()'],
    [below: '26.1', from: /\bgetLightCoords\(/, to: 'getLightColor('],
    [below: '26.1', from: /\.areComponentsBound\(\)/, to: '.isBound()'],
    [below: '26.1', from: /\.nonEmptyItemCopyStream\(\)/, to: '.nonEmptyStream().map(net.minecraft.world.item.ItemStack::copy)'],
    [below: '26.1', from: /\binteract\(Player (\w+), InteractionHand (\w+), Vec3 \w+\)/, to: 'interact(Player $1, InteractionHand $2)'],
    [below: '26.1', from: /\bsuper\.interact\((\w+), (\w+), hitLocation\)/, to: 'super.interact($1, $2)'],
    // 1.21.11 moved RenderType into renderer.rendertype and split its factories into RenderTypes.
    [below: '1.21.11', from: /import net\.minecraft\.client\.renderer\.rendertype\.RenderTypes?;/,
            to: 'import net.minecraft.client.renderer.RenderType;'],
    [below: '1.21.11', from: /\bRenderTypes(\.|::)/, to: 'RenderType$1'],
    // 1.21.9 input events: before it, screens got raw (key, scan, modifiers) / (x, y, button); compat.mc has
    // look-alike records and the overrides themselves are //? blocks.
    [below: '1.21.9', from: /import net\.minecraft\.client\.input\.(KeyEvent|MouseButtonEvent);/,
            to: 'import za.co.neroland.nerospace.compat.mc.$1;'],
    [below: '1.21.9', from: /\b(this\.\w+)\.keyPressed\(event\)/, to: '$1.keyPressed(event.key(), event.scancode(), event.modifiers())'],
    // 1.21.9 render states + SubmitNodeCollector: before it, client.compat has same-named look-alikes that run the
    // 26.x submit(..) code straight into the old immediate-mode buffers.
    [below: '1.21.9', from: /import net\.minecraft\.client\.renderer\.(SubmitNodeCollector|blockentity\.BlockEntityRenderer|blockentity\.state\.BlockEntityRenderState|feature\.ModelFeatureRenderer|state\.(?:level\.)?CameraRenderState|entity\.EntityRenderer);/,
            to: 'import za.co.neroland.nerospace.client.compat.$1;'],
    [below: '1.21.9', from: /import za\.co\.neroland\.nerospace\.client\.compat\.(?:\w+\.)*(\w+);/, to: 'import za.co.neroland.nerospace.client.compat.$1;'],
    [below: '1.21.9', from: /\.(renderState|filterIndicator)\.submit\(poseStack, collector, ([\w.]+), ([\w.]+), 0\)/,
            to: '.$1.render(poseStack, collector.buffers(), $2, $3)'],
    // 1.21.6 ValueInput/ValueOutput calls Core's 1.21.1-1.21.5 look-alikes don't carry: compat.mc.Values.
    [below: '1.21.6', from: /\b(input|output)\.(putDouble|putFloat|getDoubleOr|getFloatOr|storeNullable|child|childOrEmpty)\(/,
            to: 'za.co.neroland.nerospace.compat.mc.Values.$2($1, '],
    [below: '1.21.6', from: /\bContainerHelper\.(saveAllItems|loadAllItems)\((input|output), /,
            to: 'za.co.neroland.nerospace.compat.mc.Values.$1($2, '],
    // 1.21.6: Commands.hasPermission(level) predicates (compat.mc.PermissionCompat before it), and
    // ServerPlayer.level() narrowed to ServerLevel (it was serverLevel()).
    [below: '1.21.6', from: /\b(?:net\.minecraft\.commands\.)?Commands\.hasPermission\(/, to: 'za.co.neroland.nerospace.compat.mc.PermissionCompat.level('],
    [below: '1.21.6', from: /\bServerLevel (\w+) = (player|serverPlayer|sp)\.level\(\);/, to: 'ServerLevel $1 = $2.serverLevel();'],
    [below: '1.21.6', from: /\bsnapshot\((player|serverPlayer|sp)\.level\(\)\)/, to: 'snapshot($1.serverLevel())'],
    [below: '1.21.6', from: /\.hurtAndBreak\((\w+), (\w+), hand\)/,
            to: '.hurtAndBreak($1, $2, net.minecraft.world.entity.LivingEntity.getSlotForHand(hand))'],
    [below: '1.21.6', from: /\b(g|extractor)\.setTooltipForNextFrame\(/,
            to: '$1.renderTooltip(net.minecraft.client.Minecraft.getInstance().font, '],
    [below: '1.21.6', from: /\b(g|extractor)\.setComponentTooltipForNextFrame\(/, to: '$1.renderComponentTooltip('],
    [below: '1.21.6', from: /\bScreenshot\.grab\(([^,]+), ([^,]+), target, 1,/, to: 'Screenshot.grab($1, $2, target,'],
    // NeoForge 21.6 attachments serialize through a MapCodec; before it a plain Codec.
    [below: '1.21.6', from: /\.serialize\((Codec\.\w+(?:\.listOf\(\))?)\.fieldOf\("\w+"\)\)/, to: '.serialize($1)'],
    // 1.21.6 GUI pipelines: before it, blit took a RenderType factory.
    [below: '1.21.6', from: /\bRenderPipelines\.GUI_TEXTURED\b/, to: 'net.minecraft.client.renderer.RenderType::guiTextured'],
    // NeoForge 21.9 transfer API: before it, items/fluids used the IItemHandler/IFluidHandler capabilities
    // (Nerospace's NeoForge adapters carry //? variants for those).
    [below: '1.21.9', from: /import net\.neoforged\.neoforge\.transfer\.[\w.]+;/, to: ''],
    [below: '1.21.9', from: /\bCapabilities\.Item\.BLOCK\b/, to: 'Capabilities.ItemHandler.BLOCK'],
    [below: '1.21.9', from: /\bCapabilities\.Fluid\.BLOCK\b/, to: 'Capabilities.FluidHandler.BLOCK'],
    [below: '1.21.9', from: /\bnew WorldlyContainerWrapper\(/, to: 'new net.neoforged.neoforge.items.wrapper.SidedInvWrapper('],
    [below: '1.21.9', from: /\bVanillaContainerWrapper\.of\(/, to: 'new net.neoforged.neoforge.items.wrapper.InvWrapper('],
    [below: '1.21.9', from: /\bResourceHandler<FluidResource>/, to: 'net.neoforged.neoforge.fluids.capability.IFluidHandler'],
    // Loader changes at 1.21.9: NeoForge FMLEnvironment fields became methods; Forge tick events became records and
    // its mod-bus events gained a static BUS (1.21.6-1.21.8 reach them through the mod's bus group).
    [below: '1.21.9', from: /\bFMLEnvironment\.getDist\(\)/, to: 'FMLEnvironment.dist'],
    [below: '1.21.9', from: /\bFMLEnvironment\.isProduction\(\)/, to: 'FMLEnvironment.production'],
    [below: '1.21.9', from: /\bevent\.player\(\)/, to: 'event.player'],
    [below: '1.21.9', from: /\bevent\.server\(\)/, to: 'event.getServer()'],
    [below: '1.21.9', from: /\b((?:net\.minecraftforge\.client\.event\.)?(?:EntityRenderersEvent\.RegisterRenderers|AddGuiOverlayLayersEvent|RegisterParticleProvidersEvent|RegisterClientReloadListenersEvent))\.BUS\./,
            to: '$1.getBus(modBusGroup).'],
    // 1.21.9 changes: Properties.noCollission typo fixed, comparator output gained the read direction (unused
    // here), entityInside gained isPrecise, authlib 7 made GameProfile a record.
    [below: '1.21.9', from: /\.noCollision\(\)/, to: '.noCollission()'],
    [below: '1.21.9', from: /\bgetAnalogOutputSignal\(BlockState (\w+), Level (\w+), BlockPos (\w+), Direction \w+\)/,
            to: 'getAnalogOutputSignal(BlockState $1, Level $2, BlockPos $3)'],
    [below: '1.21.9', from: /,\s*boolean isPrecise\)/, to: ')'],
    [below: '1.21.9', from: /\bsuper\.entityInside\((\w+), (\w+), (\w+), (\w+), (\w+), isPrecise\)/,
            to: 'super.entityInside($1, $2, $3, $4, $5)'],
    [below: '1.21.9', from: /\b(getProfile|getGameProfile)\(\)\.id\(\)/, to: '$1().getId()'],
    [below: '1.21.9', from: /\b(getProfile|getGameProfile)\(\)\.name\(\)/, to: '$1().getName()'],
    // 1.21.5 added InsideBlockEffectApplier to entityInside.
    [below: '1.21.5', from: /import net\.minecraft\.world\.entity\.InsideBlockEffectApplier;/, to: ''],
    [below: '1.21.5', from: /,\s*InsideBlockEffectApplier \w+\)/, to: ')'],
    [below: '1.21.5', from: /\bsuper\.entityInside\((\w+), (\w+), (\w+), (\w+), effects\)/, to: 'super.entityInside($1, $2, $3, $4)'],
    // ChunkPos.x()/z() were public fields before 26.1 (keyed on this codebase's ChunkPos variable names).
    [below: '26.1', from: /\b(chunkPos|centre)\.([xz])\(\)/, to: '$1.$2'],
    // 1.21.5 renames: MobEffects.CONFUSION -> NAUSEA, Entity.moveTo -> snapTo, Inventory.items -> getNonEquipmentItems(),
    // ClickEvent factories -> records, Unit gained a STREAM_CODEC, RenderPipelines arrived (blit uses RenderType before).
    [below: '1.21.5', from: /\bMobEffects\.NAUSEA\b/, to: 'MobEffects.CONFUSION'],
    [below: '1.21.5', from: /\.snapTo\(/, to: '.moveTo('],
    [below: '1.21.5', from: /\.getNonEquipmentItems\(\)/, to: '.items'],
    [below: '1.21.5', from: /\bnew ClickEvent\.OpenUrl\(URI\.create\((\w+)\)\)/, to: 'new ClickEvent(ClickEvent.Action.OPEN_URL, $1)'],
    [below: '1.21.5', from: /\bnew net\.minecraft\.network\.chat\.ClickEvent\.CopyToClipboard\((\w+)\)/,
            to: 'new net.minecraft.network.chat.ClickEvent(net.minecraft.network.chat.ClickEvent.Action.COPY_TO_CLIPBOARD, $1)'],
    [below: '1.21.5', from: /\bUnit\.STREAM_CODEC\b/, to: 'net.minecraft.network.codec.StreamCodec.unit(Unit.INSTANCE)'],
    [below: '1.21.5', from: /import net\.minecraft\.client\.renderer\.RenderPipelines;/, to: ''],
    // 1.21.5: Entity.getInterpolation() (compat.mc.InterpolationHandler before it, fed from lerpTo), the TooltipDisplay
    // tooltip signature, ItemModelResolver's left-hand flag.
    [below: '1.21.5', from: /\bnet\.minecraft\.world\.entity\.InterpolationHandler\b/, to: 'za.co.neroland.nerospace.compat.mc.InterpolationHandler'],
    [below: '1.21.5', from: /@Override(\s+)public ((?:[\w.]+\.)?InterpolationHandler) getInterpolation\(\)/, to: 'public $2 getInterpolation()'],
    [below: '1.21.5', from: /import net\.minecraft\.world\.item\.component\.TooltipDisplay;/, to: ''],
    [below: '1.21.5', from: /TooltipDisplay display,(\s*)Consumer<Component> tooltip, TooltipFlag flag\) \{/,
            to: 'java.util.List<Component> tooltipLines,$1TooltipFlag flag) { Consumer<Component> tooltip = tooltipLines::add;'],
    [below: '1.21.5', from: /super\.appendHoverText\(stack, context, display, tooltip, flag\)/, to: 'super.appendHoverText(stack, context, tooltipLines, flag)'],
    [below: '1.21.5', from: /\.updateForTopItem\((\s*[\w.]+,\s*[\w.()]+,\s*ItemDisplayContext\.\w+,)/, to: '.updateForTopItem($1 false,'],
    [below: '1.21.5', from: /(fallOn\(Level \w+, BlockState \w+, BlockPos \w+, Entity \w+, )double (\w+)\)/, to: '$1float $2)'],
    // 1.21.5 split block removal into BlockEntity.preRemoveSideEffects + Block.affectNeighborsAfterRemoval; before it
    // the blocks' onRemove (//? blocks) calls the same code.
    [below: '1.21.5', from: /@Override(\s+)public void preRemoveSideEffects\(/, to: 'public void preRemoveSideEffects('],
    [below: '1.21.5', from: /\bsuper\.preRemoveSideEffects\(\w+, \w+\);/, to: ''],
    [below: '1.21.5', from: /\bsuper\.affectNeighborsAfterRemoval\(\w+, \w+, \w+, \w+\);/, to: ''],
    // Forge before 1.21.6 runs EventBus 6: one IEventBus per mod (no BusGroup), game events on
    // MinecraftForge.EVENT_BUS with the event type taken from the (typed) listener, generic capability events.
    [below: '1.21.6', from: /import net\.minecraftforge\.eventbus\.api\.bus\.BusGroup;/, to: 'import net.minecraftforge.eventbus.api.IEventBus;'],
    [below: '1.21.6', from: /\bBusGroup\b/, to: 'IEventBus'],
    [below: '1.21.6', from: /\.getModBusGroup\(\)/, to: '.getModEventBus()'],
    [below: '1.21.6', from: /\bAttachCapabilitiesEvent\.BlockEntities\.BUS\.addListener\(/,
            to: 'net.minecraftforge.common.MinecraftForge.EVENT_BUS.addGenericListener(net.minecraft.world.level.block.entity.BlockEntity.class, '],
    [below: '1.21.6', from: /\bAttachCapabilitiesEvent\.Entities\.BUS\.addListener\(/,
            to: 'net.minecraftforge.common.MinecraftForge.EVENT_BUS.addGenericListener(net.minecraft.world.entity.Entity.class, '],
    [below: '1.21.6', from: /\bAttachCapabilitiesEvent\.LevelChunks\.BUS\.addListener\(/,
            to: 'net.minecraftforge.common.MinecraftForge.EVENT_BUS.addGenericListener(net.minecraft.world.level.chunk.LevelChunk.class, '],
    [below: '1.21.6', from: /\bAttachCapabilitiesEvent\.BlockEntities\b/, to: 'AttachCapabilitiesEvent<net.minecraft.world.level.block.entity.BlockEntity>'],
    [below: '1.21.6', from: /\bAttachCapabilitiesEvent\.Entities\b/, to: 'AttachCapabilitiesEvent<net.minecraft.world.entity.Entity>'],
    [below: '1.21.6', from: /\bAttachCapabilitiesEvent\.LevelChunks\b/, to: 'AttachCapabilitiesEvent<net.minecraft.world.level.chunk.LevelChunk>'],
    [below: '1.21.6', from: /\b((?:[a-z]\w*\.)*[A-Z][\w.]*)\.getBus\((\w+)\)\.addListener\((\w+) ->/, to: '$2.addListener(($1 $3) ->'],
    [below: '1.21.6', from: /\b(?:[a-z]\w*\.)*[A-Z][\w.]*\.getBus\((\w+)\)\.addListener\(/, to: '$1.addListener('],
    [below: '1.21.6', from: /\b((?:[a-z]\w*\.)*[A-Z][\w.]*)\.BUS\.addListener\((\w+) ->/, to: 'net.minecraftforge.common.MinecraftForge.EVENT_BUS.addListener(($1 $2) ->'],
    [below: '1.21.6', from: /\b(?:[a-z]\w*\.)*[A-Z][\w.]*\.BUS\.addListener\(/, to: 'net.minecraftforge.common.MinecraftForge.EVENT_BUS.addListener('],
]

// Shared common source — pulled into every loader node (single copy -> no drift).
// Dynamic, machine-independent paths (resolved from rootProject.projectDir).
ext.commonJava = "${rootProject.projectDir}/common/src/main/java"
ext.commonResources = "${rootProject.projectDir}/common/src/main/resources"

subprojects {
    apply plugin: 'java'

    // Minecraft 1.21.x runs on Java 21, so its cells must emit Java 21 bytecode (and may not use
    // Java 22+ language features). 26.x cells stay on Java 25. A node's project name IS its MC version.
    def javaRelease = project.name.startsWith('1.') ? 21 : 25
    ext.javaRelease = javaRelease

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(javaRelease)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = javaRelease
    }

    repositories {
        mavenLocal() // Neroland Core (nerolandcore-<loader>-<mc>) published locally; see USING-CORE.md
        // Neroland Core from GitHub Packages — resolves in CI and on fresh clones, where mavenLocal is
        // empty. mavenLocal() above still wins for local devs who run Core's publishToMavenLocal.
        // Auth: gradle props gpr.user/gpr.key, else env GITHUB_ACTOR/GITHUB_TOKEN. The repo is only
        // DECLARED when both are present: a maven repo with a null username fails the whole resolve
        // ("Username must not be null!") the moment Gradle consults it — it does NOT fall through to
        // the next repository — so tokenless local builds must not see this repo at all. Without a
        // token, Core resolves from mavenLocal (run Core's publishToMavenLocal). See USING-CORE.md.
        def gprUser = providers.gradleProperty('gpr.user').orElse(providers.environmentVariable('GITHUB_ACTOR')).getOrNull()
        def gprKey = providers.gradleProperty('gpr.key').orElse(providers.environmentVariable('GITHUB_TOKEN')).getOrNull()
        if (gprUser != null && gprKey != null) {
            maven {
                name = 'NerolandCoreGitHubPackages'
                url = 'https://maven.pkg.github.com/Neroland/neroland-core'
                credentials {
                    username = gprUser
                    password = gprKey
                }
                content { includeGroup 'za.co.neroland.nerolandcore' }
            }
            // NeroEconomy (optional, compileOnly) — same credential rule as Core above.
            maven {
                name = 'NeroEconomyGitHubPackages'
                url = 'https://maven.pkg.github.com/Neroland/neroeconomy'
                credentials {
                    username = gprUser
                    password = gprKey
                }
                content { includeGroup 'za.co.neroland.neroeconomy' }
            }
        }
        mavenCentral()
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.neoforged.net/releases/' }
        maven { url 'https://maven.minecraftforge.net/' }
        maven { name = 'BlameJared'; url = 'https://maven.blamejared.com/' } // JEI
        // Official EMI (dev.emi) for Minecraft 1.21.1, where the unofficial 26.x port does not apply.
        maven {
            name = 'TerraformersMC'
            url = 'https://maven.terraformersmc.com/releases/'
            content { includeGroup 'dev.emi' }
        }
        // CurseMaven — EMI Unofficial Port (compat/emi). Restricted to its group so nothing else resolves here.
        maven {
            name = 'CurseMaven'
            url = 'https://cursemaven.com'
            content { includeGroup 'curse.maven' }
        }
    }

    // Generate static Eclipse projects (.project/.classpath) ONLY for the version
    // NODES (:fabric:26.1.2, :neoforge:26.2, :forge:26.2, ...), NOT the branch-parent containers
    // (:fabric / :neoforge / :forge) or root. A node lives INSIDE its branch dir
    // (fabric/versions/26.2); if the branch parent ALSO carried a .project, the redhat
    // Java extension would reject the nested node ("not a valid java project"). Keeping
    // branch parents as plain folders lets VS Code import each node as a standalone project.
    def isNode = project.parent != null && project.parent.parent != null

    // Stonecutter only preprocesses a node's own src/ tree; the shared common/ source above is spliced
    // in raw, so it could never carry `//? if >=26.3 {` blocks. Route it through Stonecutter's public
    // process() API for every NON-active node (output under build/generated/stonecutter-common/java).
    // The active node keeps the raw folder, so the IDE still edits the real files. Keep common/ in the
    // vcsVersion state, exactly like the loader src/ trees.
    if (isNode) {
        afterEvaluate { node ->
            def sc = node.extensions.findByName('stonecutter')
            if (sc == null || sc.current.active) {
                return
            }
            def raw = new File(rootProject.ext.commonJava).canonicalFile
            def outRel = 'build/generated/stonecutter-common/java'
            def outDir = node.file(outRel)
            // Mechanical renames that apply to this node (see legacyRenames below), in order.
            def renames = rootProject.ext.legacyRenames.findAll { sc.eval(sc.current.version, '<' + it.below) }
            // Preprocess one shared source tree (//? blocks + mechanical renames) into a node-local copy.
            def processTree = { File srcRoot, String dstRel ->
                def dstRoot = node.file(dstRel)
                node.delete(dstRoot)
                srcRoot.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                    def rel = srcRoot.toPath().relativize(f.toPath()).toString().replace('\\', '/')
                    def dst = new File(dstRoot, rel)
                    if (f.name.endsWith('.java') && f.getText('UTF-8').contains('//?')) {
                        sc.process(f, "${dstRel}/${rel}")
                    } else {
                        dst.parentFile.mkdirs()
                        dst.bytes = f.bytes
                    }
                    if (f.name.endsWith('.java') && !renames.isEmpty()) {
                        def text = dst.getText('UTF-8')
                        renames.each { r -> text = text.replaceAll(r.from, r.to) }
                        dst.setText(text, 'UTF-8')
                    }
                }
            }
            def processCommon = node.tasks.register('stonecutterProcessCommon') {
                group = 'stonecutter'
                description = 'Preprocesses the shared common/ Java source for this Minecraft version.'
                inputs.dir(raw)
                inputs.property('mc', sc.current.version)
                inputs.property('renames', renames.collect { "${it.from}->${it.to}" }.join('|'))
                outputs.dir(outDir)
                doLast {
                    processTree(raw, outRel)
                }
            }
            // The loader src/ trees are preprocessed by Stonecutter's own stonecutterGenerate task; apply the same
            // mechanical renames to its output so loader code follows the same rules as common/.
            def scGen = node.tasks.findByName('stonecutterGenerate')
            if (scGen != null && !renames.isEmpty()) {
                scGen.inputs.property('legacyRenames', renames.collect { "${it.from}->${it.to}" }.join('|'))
                scGen.doLast {
                    scGen.outputs.files.each { root ->
                        if (!root.exists()) return
                        root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                            if (!f.name.endsWith('.java')) return
                            def text = f.getText('UTF-8')
                            def out = text
                            renames.each { r -> out = out.replaceAll(r.from, r.to) }
                            if (out != text) f.setText(out, 'UTF-8')
                        }
                    }
                }
            }
            // Re-setting srcDirs resolves every entry to a plain File, which would drop Stonecutter's own
            // task dependency on its generated sources, so re-attach it to the untouched entries.
            def scGenerate = node.tasks.findByName('stonecutterGenerate')
            def javaSrc = node.sourceSets.main.java
            javaSrc.srcDirs = javaSrc.srcDirs.collect {
                if (it.canonicalFile == raw) {
                    return node.files(outDir).builtBy(processCommon)
                }
                return scGenerate != null ? node.files(it).builtBy(scGenerate) : it
            }
            // The shared unit tests (common/src/test/java, wired into a node's test source set by its loader
            // build script) are written against the same 26.x source state, so they get the same treatment.
            def rawTest = new File("${rootProject.projectDir}/common/src/test/java").canonicalFile
            def testSet = node.sourceSets.findByName('test')
            if (testSet != null && rawTest.isDirectory() && testSet.java.srcDirs.any { it.canonicalFile == rawTest }) {
                def testOutRel = 'build/generated/stonecutter-common/test-java'
                def processCommonTest = node.tasks.register('stonecutterProcessCommonTest') {
                    group = 'stonecutter'
                    description = 'Preprocesses the shared common/ unit-test source for this Minecraft version.'
                    inputs.dir(rawTest)
                    inputs.property('mc', sc.current.version)
                    inputs.property('renames', renames.collect { "${it.from}->${it.to}" }.join('|'))
                    outputs.dir(node.file(testOutRel))
                    doLast {
                        processTree(rawTest, testOutRel)
                    }
                }
                // As for main: keep Stonecutter's own generated test dir wired to the task that produces it.
                def scGenerateTest = node.tasks.findByName('stonecutterGenerateTest')
                testSet.java.srcDirs = testSet.java.srcDirs.collect {
                    if (it.canonicalFile == rawTest) {
                        return node.files(node.file(testOutRel)).builtBy(processCommonTest)
                    }
                    return scGenerateTest != null ? node.files(it).builtBy(scGenerateTest) : it
                }
            }
        }
    }

    // Version-specific resource overlays: common/src/main/resources-<mc> is merged OVER the shared
    // common/src/main/resources for every node whose Minecraft version is >= <mc> (later overlays win).
    // Needed where a datapack file's format differs between versions (e.g. 26.3's worldgen/feature).
    if (isNode) {
        afterEvaluate { node ->
            def sc = node.extensions.findByName('stonecutter')
            if (sc == null) {
                return
            }
            def base = new File(rootProject.ext.commonResources).canonicalFile
            def verOf = { File d -> d.name.substring('resources-'.length()) }
            // Loader-specific overlays (<loader>/src/main/resources-<mc>) follow the shared ones of the same version, so
            // a file only one loader can read (e.g. NeoForge's custom_skybox dimension attribute) wins on that loader.
            def loaderMain = new File(node.parent.projectDir, 'src/main')
            def isLoader = { File d -> d.parentFile.canonicalFile == loaderMain.canonicalFile }
            // The common nodes' loaderMain IS common/src/main: list it once.
            def sameRoot = loaderMain.canonicalFile == base.parentFile.canonicalFile
            def candidates = (base.parentFile.listFiles() ?: [] as File[]).toList() +
                    (sameRoot ? [] : (loaderMain.listFiles() ?: [] as File[]).toList())
            def overlays = candidates.findAll {
                it.isDirectory() && it.name.startsWith('resources-') && sc.eval(sc.current.version, ">=" + verOf(it))
            }.sort { a, b ->
                def x = verOf(a).tokenize('.')*.toInteger(), y = verOf(b).tokenize('.')*.toInteger()
                def n = [x.size(), y.size()].max()
                for (int i = 0; i < n; i++) {
                    int c = (i < x.size() ? x[i] : 0) <=> (i < y.size() ? y[i] : 0)
                    if (c != 0) return c
                }
                return (isLoader(a) ? 1 : 0) <=> (isLoader(b) ? 1 : 0)
            }
            if (overlays.isEmpty()) {
                return
            }
            // Stage ONLY the overlays, and ADD that directory as an extra resource srcDir — never
            // rebuild sourceSets.main.resources.srcDirs. Reading srcDirs resolves every entry to a
            // plain File and discards the task that produces it; re-adding them with a blanket
            // builtBy(stonecutterGenerate) silently replaced generateModMetadata as the producer of
            // the generated manifest, so processResources stopped running it and the jar shipped
            // with no fabric.mod.json / mods.toml. Incremental builds hid it (a manifest from an
            // earlier run was still on disk); clean builds failed.
            def outDir = node.file('build/generated/stonecutter-common/resources')
            def mergeResources = node.tasks.register('mergeCommonResources', Sync) {
                group = 'stonecutter'
                description = 'Stages the version-specific common/src/main/resources-<mc> overlays.'
                duplicatesStrategy = DuplicatesStrategy.INCLUDE // later overlays win over earlier ones
                overlays.each { from(it) }
                into(outDir)
            }
            // Appended last, so on a duplicate path the overlay wins over the shared common resources.
            node.sourceSets.main.resources.srcDir(node.files(outDir).builtBy(mergeResources))
            node.tasks.named('processResources') {
                duplicatesStrategy = DuplicatesStrategy.INCLUDE
            }
        }
    }
    // Recipe ingredients: 1.21.2 made a bare item id / "#tag" string a valid ingredient, and the source
    // recipes use that short form. For older nodes, rewrite every data/*/recipe/*.json to the
    // {"item": ..} / {"tag": ..} object form at build time (same files, overlaid last so they win), instead
    // of keeping a second hand-written copy of each recipe.
    if (isNode) {
        afterEvaluate { node ->
            def sc = node.extensions.findByName('stonecutter')
            if (sc == null || !sc.eval(sc.current.version, '<1.21.2')) {
                return
            }
            def base = new File(rootProject.ext.commonResources).canonicalFile
            def outDir = node.file('build/generated/legacy-recipes')
            def legacyRecipes = node.tasks.register('legacyRecipes') {
                group = 'stonecutter'
                description = 'Rewrites short-form recipe ingredients to the pre-1.21.2 object form.'
                inputs.dir(base)
                outputs.dir(outDir)
                doLast {
                    node.delete(outDir)
                    def slurper = new groovy.json.JsonSlurper()
                    def conv
                    conv = { v ->
                        if (v instanceof String) {
                            return v.startsWith('#') ? [tag: v.substring(1)] : [item: v]
                        }
                        return v instanceof List ? v.collect { conv(it) } : v
                    }
                    base.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                        def rel = base.toPath().relativize(f.toPath()).toString().replace('\\', '/')
                        if (!(rel ==~ /data\/[^\/]+\/recipe\/.+\.json/)) {
                            return
                        }
                        def json = slurper.parse(f)
                        if (json.key instanceof Map) {
                            json.key = json.key.collectEntries { k, v -> [(k): conv(v)] }
                        }
                        if (json.ingredients instanceof List) {
                            json.ingredients = json.ingredients.collect { conv(it) }
                        }
                        ['ingredient', 'template', 'base', 'addition'].each { k ->
                            if (json[k] != null) {
                                json[k] = conv(json[k])
                            }
                        }
                        def dst = new File(outDir, rel)
                        dst.parentFile.mkdirs()
                        dst.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)), 'UTF-8')
                    }
                }
            }
            node.sourceSets.main.resources.srcDir(node.files(outDir).builtBy(legacyRecipes))
            node.tasks.named('processResources') {
                duplicatesStrategy = DuplicatesStrategy.INCLUDE
            }
        }
    }
    if (isNode) {
        // Compute the unique name HERE (project = the Gradle project); inside
        // `eclipse.project {}` `project` rebinds to the Eclipse model, which has no `parent`.
        def nodeEclipseName = "nerospace-${project.parent.name}-${project.name}"
        apply plugin: 'eclipse'
        eclipse {
            project {
                // Multiple nodes share the leaf name ('26.1.2' under fabric/neoforge/forge);
                // give each a unique Eclipse project name.
                name = nodeEclipseName
                // Strip Loom's Buildship nature so VS Code imports the static .classpath
                // instead of attempting a live (failing) Gradle import.
                file {
                    whenMerged { proj ->
                        proj.natures.removeAll { it.startsWith('org.eclipse.buildship') }
                        proj.buildCommands.removeAll { it.name.startsWith('org.eclipse.buildship') }
                    }
                }
            }
            // SINGLE SOURCE OF TRUTH: merge tools/ecj.prefs into this node's generated
            // .settings/org.eclipse.jdt.core.prefs so the VS Code Java language server applies the
            // EXACT same compiler-problem severities (and disabled null analysis) as the `ecjCheck`
            // Gradle task. Edit tools/ecj.prefs, re-run `./gradlew eclipse`, reload VS Code.
            jdt {
                file {
                    withProperties { props ->
                        def prefsFile = rootProject.file('tools/ecj.prefs')
                        if (prefsFile.exists()) {
                            def loaded = new Properties()
                            prefsFile.withInputStream { loaded.load(it) }
                            loaded.stringPropertyNames().each { k ->
                                props.setProperty(k, loaded.getProperty(k))
                            }
                        }
                    }
                }
            }
            // De-duplicate source-folder classpath entries. Loom/ModDevGradle + the `eclipse` plugin
            // can emit the SAME generated source dir twice (e.g. build/generated/sources/modMetadata
            // and build/generated/stonecutter/main/resources — once as a real entry, once with
            // excluding="**"), which Eclipse/VS Code rejects as "Build path contains duplicate entry"
            // and refuses to build. Keep one entry per path, preferring the non-excluded (real) one.
            classpath {
                file {
                    whenMerged { cp ->
                        def byPath = [:]
                        cp.entries.each { e ->
                            if (e.kind == 'src') {
                                def prev = byPath[e.path]
                                if (prev == null) {
                                    byPath[e.path] = e
                                } else {
                                    def prevAll = (prev.hasProperty('excludes') ? prev.excludes : []).contains('**')
                                    def curAll = (e.hasProperty('excludes') ? e.excludes : []).contains('**')
                                    if (prevAll && !curAll) {
                                        byPath[e.path] = e
                                    }
                                }
                            }
                        }
                        def keep = byPath.values() as Set
                        cp.entries.removeAll { it.kind == 'src' && !keep.contains(it) }
                    }
                }
            }
        }
    }
}

// ---------------------------------------------------------------------------
// Bidirectional Blockbench <-> Java entity-model sync for the MULTILOADER.
// Runs the shared tools/model_sync.py with --multiloader, so it operates on
// common/src/main/java (the entity model classes carry the
// model_sync:begin/end markers) + the repo-root art/blockbench/entity/*.bbmodel.
// Standalone (NOT auto-wired into compileJava — keeps the green build free of a
// hard Python requirement); run it deliberately when you edit a .bbmodel or the
// marked Java cube block:
//   ./gradlew syncModels                          # auto direction (newest wins)
//   ./gradlew syncModels -PmodelSyncArgs=--check  # report drift, write nothing
//   ./gradlew syncModels -PmodelSyncArgs=--to-java # force .bbmodel -> Java
// Python is auto-detected (python/py/python3 + pyenv shims); override -PpythonCmd=.
// ---------------------------------------------------------------------------
tasks.register('syncModels') {
    group = 'nerospace'
    description = 'Sync entity-model Blockbench <-> Java for common (tools/model_sync.py --multiloader).'
    // <repo> = the project root (now flattened); run python from there so tools/model_sync.py resolves.
    def repoRoot = rootProject.projectDir
    def pythonOverride = providers.gradleProperty('pythonCmd').getOrNull()
    def isWindows = System.getProperty('os.name').toLowerCase().contains('win')
    def pyenvRoot = System.getenv('PYENV_ROOT') ?: System.getenv('PYENV')
    if (!pyenvRoot && System.getenv('USERPROFILE')) {
        pyenvRoot = System.getenv('USERPROFILE') + '\\.pyenv\\pyenv-win'
    }
    if (!pyenvRoot && System.getenv('HOME')) {
        pyenvRoot = System.getenv('HOME') + '/.pyenv'
    }
    def extra = (providers.gradleProperty('modelSyncArgs').getOrElse('')).split(' ').findAll { it } as List
    doLast {
        def wrap = { c -> isWindows ? (['cmd', '/c'] + c) : c }
        def candidates = []
        if (pythonOverride) candidates << [pythonOverride]
        candidates += [['python'], ['py'], ['python3']]
        if (pyenvRoot) {
            def r = pyenvRoot.replaceAll(/[\\\/]+$/, '')
            candidates << [r + (isWindows ? '\\shims\\python.bat' : '/shims/python')]
            candidates << [r + (isWindows ? '\\bin\\python.exe' : '/bin/python')]
        }
        def python = null
        for (c in candidates) {
            try {
                def probe = wrap(c + ['--version']).execute(null, repoRoot)
                def o = new StringBuilder(); def e = new StringBuilder()
                probe.consumeProcessOutput(o, e); probe.waitFor()
                if (probe.exitValue() == 0) { python = c; break }
            } catch (ignored) {}
        }
        if (python == null) {
            throw new GradleException(
                "model_sync: no Python found (tried ${candidates}); set -PpythonCmd=<path>. " +
                "Detected pyenv root: ${pyenvRoot}")
        }
        def proc = wrap(python + ['tools/model_sync.py', '--multiloader'] + extra).execute(null, repoRoot)
        def out = new StringBuilder(); def err = new StringBuilder()
        proc.consumeProcessOutput(out, err)
        proc.waitFor()
        if (out.length() > 0) println out.toString().trim()
        if (proc.exitValue() != 0) {
            throw new GradleException("model_sync failed (exit ${proc.exitValue()}):\n${err}")
        }
    }
}

// ---------------------------------------------------------------------------
// Regenerate procedural textures + Blockbench block/item models for the MULTILOADER
// (tools/gen_textures.py + gen_bbmodels.py with --multiloader). Both are ADDITIVE — they
// skip any asset that already exists, so reruns only fill gaps and never overwrite
// committed/edited art. gen_textures needs Pillow (skips gracefully without it). Run on
// demand: `./gradlew genAssets`. Python auto-detected; override -PpythonCmd=.
// ---------------------------------------------------------------------------
tasks.register('genAssets') {
    group = 'nerospace'
    description = 'Regenerate textures + Blockbench block/item models into common (additive) and the rocket entity models (spec-driven).'
    def repoRoot = rootProject.projectDir
    def pythonOverride = providers.gradleProperty('pythonCmd').getOrNull()
    def isWindows = System.getProperty('os.name').toLowerCase().contains('win')
    def pyenvRoot = System.getenv('PYENV_ROOT') ?: System.getenv('PYENV')
    if (!pyenvRoot && System.getenv('USERPROFILE')) {
        pyenvRoot = System.getenv('USERPROFILE') + '\\.pyenv\\pyenv-win'
    }
    if (!pyenvRoot && System.getenv('HOME')) {
        pyenvRoot = System.getenv('HOME') + '/.pyenv'
    }
    doLast {
        def wrap = { c -> isWindows ? (['cmd', '/c'] + c) : c }
        def candidates = []
        if (pythonOverride) candidates << [pythonOverride]
        candidates += [['python'], ['py'], ['python3']]
        if (pyenvRoot) {
            def r = pyenvRoot.replaceAll(/[\\\/]+$/, '')
            candidates << [r + (isWindows ? '\\shims\\python.bat' : '/shims/python')]
            candidates << [r + (isWindows ? '\\bin\\python.exe' : '/bin/python')]
        }
        def python = null
        for (c in candidates) {
            try {
                def probe = wrap(c + ['--version']).execute(null, repoRoot)
                probe.consumeProcessOutput(new StringBuilder(), new StringBuilder()); probe.waitFor()
                if (probe.exitValue() == 0) { python = c; break }
            } catch (ignored) {}
        }
        if (python == null) {
            throw new GradleException("genAssets: no Python found; set -PpythonCmd=<path>. pyenv root: ${pyenvRoot}")
        }
        ['tools/gen_textures.py', 'tools/gen_bbmodels.py', 'tools/rocket_models.py'].each { script ->
            def proc = wrap(python + [script, '--multiloader']).execute(null, repoRoot)
            def out = new StringBuilder(); def err = new StringBuilder()
            proc.consumeProcessOutput(out, err); proc.waitFor()
            if (out.length() > 0) println out.toString().trim()
            if (proc.exitValue() != 0) {
                throw new GradleException("${script} failed (exit ${proc.exitValue()}):\n${err}")
            }
        }
    }
}

// ---------------------------------------------------------------------------
// Cap the captured gallery screenshots to <=1920px wide and <4 MiB each, IN PLACE, so they're
// gallery-ready (the CurseForge 1920x1080 target + under the 4 MB upload limit) and light in git.
// The capture harness writes at the game window's native resolution, so on a big display the PNGs
// come out 2.5k+ wide and 5-8 MB. Run this after a `/nsgallery capture` pass, before committing:
//   ./gradlew compressScreenshots
//   ./gradlew compressScreenshots -PscreenshotArgs="--max-mb 3 --max-width 1600"
// Needs Pillow (pip install Pillow). Python auto-detected (python/py/python3 + pyenv); override
// -PpythonCmd=. Only ever shrinks — images already within the caps are left as-is.
// ---------------------------------------------------------------------------
tasks.register('compressScreenshots') {
    group = 'nerospace'
    description = 'Cap captured gallery screenshots to <=1920px / <4MB in place (tools/compress_screenshots.py).'
    def repoRoot = rootProject.projectDir
    def pythonOverride = providers.gradleProperty('pythonCmd').getOrNull()
    def isWindows = System.getProperty('os.name').toLowerCase().contains('win')
    def pyenvRoot = System.getenv('PYENV_ROOT') ?: System.getenv('PYENV')
    if (!pyenvRoot && System.getenv('USERPROFILE')) {
        pyenvRoot = System.getenv('USERPROFILE') + '\\.pyenv\\pyenv-win'
    }
    if (!pyenvRoot && System.getenv('HOME')) {
        pyenvRoot = System.getenv('HOME') + '/.pyenv'
    }
    def extra = (providers.gradleProperty('screenshotArgs').getOrElse('')).split(' ').findAll { it } as List
    doLast {
        def wrap = { c -> isWindows ? (['cmd', '/c'] + c) : c }
        def candidates = []
        if (pythonOverride) candidates << [pythonOverride]
        candidates += [['python'], ['py'], ['python3']]
        if (pyenvRoot) {
            def r = pyenvRoot.replaceAll(/[\\\/]+$/, '')
            candidates << [r + (isWindows ? '\\shims\\python.bat' : '/shims/python')]
            candidates << [r + (isWindows ? '\\bin\\python.exe' : '/bin/python')]
        }
        def python = null
        for (c in candidates) {
            try {
                def probe = wrap(c + ['--version']).execute(null, repoRoot)
                probe.waitFor()
                if (probe.exitValue() == 0) { python = c; break }
            } catch (ignored) {}
        }
        if (python == null) {
            throw new GradleException("compressScreenshots: no Python found; set -PpythonCmd=<path>. pyenv root: ${pyenvRoot}")
        }
        def proc = wrap(python + ['tools/compress_screenshots.py'] + extra).execute(null, repoRoot)
        def out = new StringBuilder(); def err = new StringBuilder()
        proc.consumeProcessOutput(out, err); proc.waitFor()
        if (out.length() > 0) println out.toString().trim()
        if (proc.exitValue() != 0) {
            throw new GradleException("compress_screenshots.py failed (exit ${proc.exitValue()}):\n${err}")
        }
    }
}
