# Crowdin configuration. Source strings are en_us; translations are written back as lowercase
# Minecraft lang files (zh_cn, it_it). Missing keys fall back to en_us in-game.
# Credentials come from environment variables only; never commit a token.
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
preserve_hierarchy: true
files:
  - source: /common/src/main/resources/assets/nerospace/lang/en_us.json
    translation: /common/src/main/resources/assets/nerospace/lang/%locale_with_underscore%.json
    dest: /nerospace/lang/en_us.json
    ignore: [/common/src/main/resources/assets/nerospace/lang/en_za.json]
    languages_mapping:
      locale_with_underscore:
        zh-CN: zh_cn
        it: it_it
    skip_untranslated_strings: true
  - source: /wiki/*.md
    translation: /wiki/i18n/%locale_with_underscore%/%original_file_name%
    dest: /nerospace/wiki/%original_file_name%
    ignore: [/wiki/Privacy-and-Data.md, /wiki/_Sidebar.md]
    languages_mapping:
      locale_with_underscore:
        zh-CN: zh_cn
        it: it_it
