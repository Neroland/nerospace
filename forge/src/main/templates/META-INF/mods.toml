modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${mod_license}"
logoFile = "nerospace_logo.png"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
Nerospace - multiloader build (Forge).
'''

[[mixins]]
config = "nerospace-common.mixins.json"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_loader_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Neroland Core — required shared foundation; must load BEFORE Nerospace (ordering = AFTER).
[[dependencies.${mod_id}]]
modId = "nerolandcore"
mandatory = true
versionRange = "${nerolandcore_version_range}"
ordering = "AFTER"
side = "BOTH"

# Energized Power — optional interop. When present it must load BEFORE Nerospace so its Forge-Energy
# capabilities and c: material tags are available; discovery is via Core tags/capabilities, never a
# hard import.
[[dependencies.${mod_id}]]
modId = "energizedpower"
mandatory = false
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

# NeroEconomy — optional. When present, servers may opt in to first-visit rewards and launch/docking fees
# (all default to 0 = off). Floor 0.3.0-beta.1 = the first release with the sibling-economy API.
[[dependencies.${mod_id}]]
modId = "neroeconomy"
mandatory = false
versionRange = "[0.3.0-beta.1,)"
ordering = "AFTER"
side = "BOTH"

# JEI — optional recipe-viewer compat. Floor = the oldest JEI on this Minecraft line that the compat/jei
# plugin is known to work with (jei_min_version_<mc> in gradle.properties); an older JEI is refused with a
# clear message instead of crashing in the recipe screen (MC-NEROSPACE-V).
[[dependencies.${mod_id}]]
modId = "jei"
mandatory = false
versionRange = "${jei_version_range}"
ordering = "NONE"
side = "CLIENT"
