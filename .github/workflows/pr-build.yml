name: Pull request

# Compiles one cell per loader and runs the NeoForge test suite. It does not publish,
# tag, or upload anywhere. The release trigger stays in publish.yml.

on:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Compile one cell per loader
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1

      - name: Setup JDK 25
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # 26.2 is the committed source state (stonecutter vcsVersion). NeoForge owns the
      # plain-JVM tests. Fabric and Forge are compile-only here. Nothing is published.
      - name: Compile Fabric and Forge, test NeoForge
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew
          :fabric:26.2:compileJava
          :forge:26.2:compileJava
          :neoforge:26.2:test
          --stacktrace
